<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Työohje-wiki</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button id="menuToggle" class="icon-btn" title="Valikko" aria-label="Valikko">☰</button>
    <h1 class="logo" data-nav="home">📘 Työohje-wiki</h1>
    <form id="searchForm" class="search">
      <input id="searchInput" type="search" placeholder="Hae ohjeista ja huomioista…" autocomplete="off" />
    </form>
    <div class="user">
      <label>Nimesi:</label>
      <input id="authorInput" type="text" placeholder="Etunimi" />
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <nav>
        <button class="nav-link" data-nav="home">🏠 Etusivu</button>
        <button class="nav-link" data-nav="shiftlog">📝 Vuoroloki</button>
      </nav>
      <div class="sidebar-section">
        <div class="sidebar-title">
          <span>Kohteet</span>
          <button id="addCategoryBtn" class="icon-btn small" title="Lisää kohde">＋</button>
        </div>
        <ul id="categoryList" class="category-list"></ul>
      </div>
    </aside>

    <main id="content" class="content">
      <!-- Näkymät renderöidään tähän -->
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
