<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palmia Hälytyskeskus – Työohjeet (Sandbox)</title>
  <!-- Jaettu ulkoasu palvelinversion kanssa: muokkaa vain public/styles.css -->
  <link rel="stylesheet" href="../public/styles.css" />
  <style>
    /* Vain sandboxille: pieni merkki joka erottaa demon oikeasta versiosta */
    .sandbox-badge {
      background: #1c2430; color: #fff; font-size: 11px; font-weight: 700;
      padding: 2px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: .04em;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <button id="menuToggle" class="icon-btn" title="Valikko" aria-label="Valikko">☰</button>
    <div class="brand" data-nav="home">
      <span class="brand-mark">P</span>
      <span class="brand-text"><strong>Palmia</strong><small>Hälytyskeskus · Työohjeet</small></span>
    </div>
    <span class="sandbox-badge" title="Demo: data tallentuu vain tähän selaimeen">Sandbox</span>
    <form id="searchForm" class="search">
      <input id="searchInput" type="search" placeholder="Hae ohjeista, huomioista ja tiedostoista…" autocomplete="off" />
    </form>
    <div class="user">
      <label>Nimesi:</label>
      <input id="authorInput" type="text" placeholder="Etunimi" />
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <nav>
        <button class="nav-link" data-nav="home">🏠 Etusivu</button>
        <button class="nav-link" data-nav="shiftlog">📝 Vuoroloki</button>
      </nav>
      <div class="sidebar-section">
        <div class="sidebar-title">
          <span>Ohjeet</span>
          <button id="addCategoryBtn" class="icon-btn small" title="Lisää kategoria">＋</button>
        </div>
        <ul id="categoryList" class="category-list"></ul>
      </div>
    </aside>

    <main id="content" class="content"></main>
  </div>

  <div id="toast" class="toast"></div>

  <!-- Sandbox-datakerros (selaimen tallennus) korvaa store-api.js:n -->
  <script src="store-local.js"></script>
  <script src="../public/app.js"></script>
</body>
</html>
