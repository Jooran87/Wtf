<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Työohje-wiki – Sandbox</title>
  <style>
:root {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --border: #e2e6ec;
  --text: #1c2430;
  --muted: #6b7686;
  --brand: #1f6feb;
  --brand-dark: #1a5fd0;
  --danger: #d43c3c;
  --ok: #2ea043;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
  --radius: 8px;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  font-size: 15px;
}

/* Topbar */
.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 18px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.logo { font-size: 18px; margin: 0; cursor: pointer; white-space: nowrap; }
.search { flex: 1; max-width: 520px; }
.search input {
  width: 100%; padding: 9px 14px; border: 1px solid var(--border);
  border-radius: 20px; font-size: 14px; outline: none;
}
.search input:focus { border-color: var(--brand); }
.user { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.user input { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; width: 110px; }

/* Layout */
.layout { display: flex; align-items: flex-start; }
.sidebar {
  width: 260px; flex-shrink: 0; background: var(--panel);
  border-right: 1px solid var(--border); min-height: calc(100vh - 57px);
  padding: 14px 10px;
}
.sidebar nav { display: flex; flex-direction: column; gap: 2px; margin-bottom: 16px; }
.nav-link {
  text-align: left; background: none; border: none; padding: 9px 12px;
  border-radius: var(--radius); cursor: pointer; font-size: 14px; color: var(--text);
}
.nav-link:hover { background: #eef2f7; }
.nav-link.active { background: #e5efff; color: var(--brand); font-weight: 600; }

.sidebar-section { border-top: 1px solid var(--border); padding-top: 12px; }
.sidebar-title {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 8px 8px; font-size: 12px; text-transform: uppercase;
  letter-spacing: .04em; color: var(--muted); font-weight: 700;
}
.category-list { list-style: none; margin: 0; padding: 0; }
.category-list li { display: flex; align-items: center; }
.category-list .cat-btn {
  flex: 1; text-align: left; background: none; border: none; padding: 8px 12px;
  border-radius: var(--radius); cursor: pointer; font-size: 14px; color: var(--text);
}
.category-list .cat-btn:hover { background: #eef2f7; }
.category-list .cat-btn.active { background: #e5efff; color: var(--brand); font-weight: 600; }

/* Content */
.content { flex: 1; padding: 26px 34px; max-width: 900px; }
.content h2 { margin-top: 0; }
.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.muted { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

/* Buttons */
.btn {
  background: var(--brand); color: #fff; border: none; padding: 9px 16px;
  border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600;
}
.btn:hover { background: var(--brand-dark); }
.btn.secondary { background: #eef2f7; color: var(--text); }
.btn.secondary:hover { background: #e2e8f0; }
.btn.danger { background: var(--danger); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.icon-btn {
  background: none; border: none; font-size: 20px; cursor: pointer; color: var(--muted);
  padding: 2px 6px; border-radius: 6px;
}
.icon-btn:hover { background: #eef2f7; color: var(--text); }
.icon-btn.small { font-size: 15px; }
#menuToggle { display: none; }

/* Forms */
input[type=text], input[type=search], textarea, select {
  font-family: inherit; font-size: 14px;
}
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
.field input, .field textarea, .field select {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border);
  border-radius: 6px; outline: none;
}
.field textarea { min-height: 260px; resize: vertical; line-height: 1.5; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--brand); }

/* Page content rendering */
.doc { line-height: 1.65; }
.doc h1, .doc h2, .doc h3 { line-height: 1.3; }
.doc h1 { font-size: 24px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.doc h2 { font-size: 20px; }
.doc h3 { font-size: 17px; }
.doc code { background: #eef2f7; padding: 1px 5px; border-radius: 4px; font-size: 90%; }
.doc pre { background: #1c2430; color: #e6edf3; padding: 12px; border-radius: 6px; overflow-x: auto; }
.doc pre code { background: none; color: inherit; }
.doc ul, .doc ol { padding-left: 22px; }
.doc a { color: var(--brand); }
.doc blockquote { border-left: 3px solid var(--brand); margin: 0; padding: 4px 14px; color: var(--muted); }
.doc img { max-width: 100%; border-radius: 6px; }

/* Attachments */
.attach-list { list-style: none; padding: 0; margin: 8px 0 0; }
.attach-list li {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px;
}
.attach-list .att-icon { font-size: 20px; }
.attach-list .att-name { flex: 1; }
.attach-list .att-name a { color: var(--text); text-decoration: none; font-weight: 600; }
.attach-list .att-name a:hover { color: var(--brand); }
.attach-list .att-meta { font-size: 12px; color: var(--muted); }
.attach-list .snippet { font-size: 13px; color: var(--text); margin-top: 4px; font-style: italic; }
mark { background: #fff3a3; padding: 0 2px; border-radius: 2px; }

/* Shift log */
.note {
  background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--brand);
  border-radius: 6px; padding: 12px 14px; margin-bottom: 10px;
}
.note .note-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.note .note-body { white-space: pre-wrap; line-height: 1.5; }
.note .tag { background: #e5efff; color: var(--brand); padding: 1px 8px; border-radius: 10px; font-weight: 600; }

/* Home dashboard layout */
.home-grid { display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
.home-main, .home-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.home-main .card, .home-side .card { margin-bottom: 0; }
@media (max-width: 820px) { .home-grid { grid-template-columns: 1fr; } }

/* Ranked list (suosituimmat) */
.rank-list { list-style: none; margin: 0; padding: 0; counter-reset: rank; }
.rank-list li { border-bottom: 1px solid var(--border); counter-increment: rank; }
.rank-list li:last-child { border-bottom: none; }
.rank-list li.empty { counter-increment: none; }
.rank-list .page-link { position: relative; padding-left: 34px; }
.rank-list li:not(.empty) .page-link::before {
  content: counter(rank); position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 22px; height: 22px; line-height: 22px; text-align: center; font-size: 12px; font-weight: 700;
  background: #e5efff; color: var(--brand); border-radius: 50%;
}

/* Contacts */
.contact-list { list-style: none; margin: 0; padding: 0; }
.contact { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  padding: 10px 0; border-bottom: 1px solid var(--border); }
.contact:last-child { border-bottom: none; }
.contact-main { min-width: 0; }
.contact-label { font-weight: 600; }
.contact-phone { color: var(--brand); text-decoration: none; font-size: 15px; }
.contact-phone:hover { text-decoration: underline; }
.contact-actions { display: flex; flex-shrink: 0; }

/* List of pages */
.page-list { list-style: none; padding: 0; margin: 0; }
.page-list li { border-bottom: 1px solid var(--border); }
.page-list li:last-child { border-bottom: none; }
.page-list .page-link {
  display: flex; justify-content: space-between; width: 100%; text-align: left;
  background: none; border: none; padding: 12px 4px; cursor: pointer; font-size: 15px; color: var(--text);
}
.page-list .page-link:hover { color: var(--brand); }
.empty { color: var(--muted); padding: 20px; text-align: center; }

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #1c2430; color: #fff; padding: 12px 20px; border-radius: 8px;
  opacity: 0; pointer-events: none; transition: all .2s; z-index: 100; font-size: 14px;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--danger); }

/* Mobile */
@media (max-width: 780px) {
  #menuToggle { display: inline-block; }
  .sidebar {
    position: fixed; top: 57px; left: 0; bottom: 0; z-index: 30;
    transform: translateX(-100%); transition: transform .2s; box-shadow: 2px 0 12px rgba(0,0,0,.15);
  }
  .sidebar.open { transform: translateX(0); }
  .content { padding: 18px; }
  .user { display: none; }
}

    .sandbox-badge { background:#f0a020; color:#1c2430; font-size:11px; font-weight:700;
      padding:2px 8px; border-radius:10px; text-transform:uppercase; letter-spacing:.04em; }
  </style>
</head>
<body>
  <header class="topbar">
    <button id="menuToggle" class="icon-btn" title="Valikko" aria-label="Valikko">☰</button>
    <h1 class="logo" data-nav="home">📘 Työohje-wiki</h1>
    <span class="sandbox-badge" title="Demo: data tallentuu vain tähän selaimeen">Sandbox</span>
    <form id="searchForm" class="search">
      <input id="searchInput" type="search" placeholder="Hae ohjeista, huomioista ja tiedostoista…" autocomplete="off" />
    </form>
    <div class="user"><label>Nimesi:</label><input id="authorInput" type="text" placeholder="Etunimi" /></div>
  </header>
  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <nav>
        <button class="nav-link" data-nav="home">🏠 Etusivu</button>
        <button class="nav-link" data-nav="shiftlog">📝 Vuoroloki</button>
      </nav>
      <div class="sidebar-section">
        <div class="sidebar-title"><span>Kohteet</span>
          <button id="addCategoryBtn" class="icon-btn small" title="Lisää kohde">＋</button></div>
        <ul id="categoryList" class="category-list"></ul>
      </div>
    </aside>
    <main id="content" class="content"></main>
  </div>
  <div id="toast" class="toast"></div>
  <script>
'use strict';
// Datakerros SANDBOX-VERSIOLLE: ei palvelinta, kaikki selaimessa.
// - Rakenteinen data (kohteet, sivut, huomiot, liitteiden tiedot) localStorageen
// - Tiedostojen sisältö (blobit) IndexedDB:hen
// Tarjoaa saman `Store`-rajapinnan kuin store-api.js, joten app.js on identtinen.
// TARKOITUS: ulkoasun hiominen ja demo ilman asennusta. Data on vain tässä
// selaimessa; tyhjennä selaimen tallennustila nollataksesi.

const LS_KEY = 'tyowiki_sandbox_v1';

// ---------- localStorage-malli ----------
function load() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || null; } catch (_) { return null; }
}
function save(db) { localStorage.setItem(LS_KEY, JSON.stringify(db)); }
let DB = load();

const nowISO = () => new Date().toISOString();
function nextId() { DB.seq += 1; return DB.seq; }
function catName(id) { const c = DB.categories.find((x) => x.id === id); return c ? c.name : null; }
function clone(x) { return JSON.parse(JSON.stringify(x)); }

// ---------- IndexedDB blobit ----------
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('tyowiki_sandbox_files', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function putBlob(id, blob) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('files', 'readwrite');
    tx.objectStore('files').put(blob, id);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function getBlobUrl(id) {
  const db = await idb();
  const blob = await new Promise((res, rej) => {
    const tx = db.transaction('files', 'readonly');
    const rq = tx.objectStore('files').get(id);
    rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
  });
  return blob ? URL.createObjectURL(blob) : '#';
}
async function delBlob(id) {
  const db = await idb();
  return new Promise((res) => {
    const tx = db.transaction('files', 'readwrite');
    tx.objectStore('files').delete(id);
    tx.oncomplete = () => res();
  });
}

// ---------- Sallitut tiedostotyypit (kuten palvelimessa) ----------
const ALLOWED = new Set([
  'application/pdf',
  'image/png', 'image/jpeg', 'image/gif', 'image/webp', 'image/svg+xml',
  'application/msword',
  'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  'application/vnd.ms-excel',
  'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
]);
const MAX_SIZE = 50 * 1024 * 1024;

// ---------- Alustus + esimerkkidata ----------
const ready = ensureSeeded();

async function ensureSeeded() {
  if (DB) { migrateExisting(); return; }
  DB = { seq: 0, categories: [], pages: [], notes: [], attachments: [], contacts: [] };
  const linja1 = { id: nextId(), name: 'Tuotantolinja 1', sort_order: 1 };
  const pakkaamo = { id: nextId(), name: 'Pakkaamo', sort_order: 2 };
  const yleiset = { id: nextId(), name: 'Yleiset ohjeet', sort_order: 3 };
  DB.categories.push(linja1, pakkaamo, yleiset);

  const p1 = mkPage(linja1.id, 'Linjan käynnistys aamuvuorossa', `# Linjan käynnistys

## Ennen käynnistystä
- Tarkista että hätäseis-painikkeet ovat vapautettuina
- Varmista suojaovien lukitus
- Tarkista voiteluöljyn taso

## Käynnistysjärjestys
1. Kytke pääkytkin päälle
2. Odota että ohjausjärjestelmä latautuu (n. 2 min)
3. Käynnistä kuljetin **vihreästä** painikkeesta
4. Nosta nopeus vähitellen tavoitearvoon

> Huom! Jos merkkivalo vilkkuu punaisena, katso vikaohje ennen jatkamista.`, 'Matti');

  mkPage(linja1.id, 'Häiriötilanteen kuittaus', `# Häiriön kuittaus

- Paina **RESET** ohjauspaneelista
- Tarkista näytöltä vikakoodi
- Yleisimmät koodit:
  - E01 = paperitukos
  - E02 = ylikuumeneminen
  - E05 = anturihäiriö`, 'Matti');

  mkPage(pakkaamo.id, 'Pakkauskoneen puhdistus', `# Pakkauskoneen puhdistus (vuoron lopussa)

1. Pysäytä kone ja katkaise virta
2. Poista pakkausmateriaalin jäänteet
3. Pyyhi pinnat elintarvikehyväksytyllä puhdistusaineella
4. Kirjaa puhdistus lokiin`, 'Liisa');

  // Esimerkkiliite, jonka sisällöstä haku löytää osumia (snippet).
  const sampleText = 'Turvaohje: käytä aina suojalaseja ja kuulosuojaimia linjalla. '
    + 'Hätäseis-painike sijaitsee ohjauspaneelin vasemmassa reunassa. '
    + 'Kuittaa häiriö vasta kun alue on tyhjä ja turvallinen.';
  const att = {
    id: nextId(), page_id: p1.id, original_name: 'Linjan_turvaohje.pdf',
    mimetype: 'application/pdf', size: sampleText.length,
    uploaded_at: nowISO(), uploaded_by: 'Matti', text_content: sampleText,
  };
  DB.attachments.push(att);
  await putBlob(att.id, new Blob([sampleText], { type: 'application/pdf' }));

  mkNote(linja1.id, 'Matti', 'Linja 1 pyöri hyvin koko aamuvuoron. Öljynpaine hieman koholla iltapäivällä, seurataan.');
  mkNote(pakkaamo.id, 'Liisa', 'Pakkauskone jumitti kahdesti klo 14 aikaan. Puhdistettu ja kuitattu. Huoltopyyntö tehty.');
  mkNote(null, 'Liisa', 'Yleinen: varaosavarastosta loppui teippirulla. Tilaus lähtenyt.');

  // Esimerkkinä katselukertoja, jotta "Suosituimmat ohjeet" näkyy heti.
  DB.pages[0].views = 42; DB.pages[1].views = 27; DB.pages[2].views = 15;

  DB.contacts = defaultContacts();
  save(DB);
}

// Oletusyhteystiedot (esimerkkidata + migraatio vanhaan dataan).
function defaultContacts() {
  return [
    { id: nextId(), label: 'IT-tuki', phone: '040 123 4567', note: 'ma–pe 8–16, kiireet: alue 200', sort_order: 1 },
    { id: nextId(), label: 'Vuoroesihenkilö', phone: '040 234 5678', note: 'ympäri vuorokauden', sort_order: 2 },
    { id: nextId(), label: 'Kunnossapito / päivystys', phone: '040 345 6789', note: 'häiriöt ja viat', sort_order: 3 },
    { id: nextId(), label: 'Työterveys', phone: '030 555 0100', note: 'ajanvaraus', sort_order: 4 },
  ];
}

// Täydentää vanhat tallennukset uusilla kentillä ilman datan menetystä.
function migrateExisting() {
  let changed = false;
  if (!DB.contacts) { DB.contacts = defaultContacts(); changed = true; }
  DB.pages.forEach((p) => { if (typeof p.views !== 'number') { p.views = 0; changed = true; } });
  if (changed) save(DB);
}

function mkPage(catId, title, content, by) {
  const p = { id: nextId(), category_id: catId, title, content, updated_at: nowISO(), updated_by: by || '', views: 0 };
  DB.pages.push(p); return p;
}
function mkNote(catId, author, content) {
  DB.notes.push({ id: nextId(), category_id: catId, author: author || '', content, created_at: nowISO() });
}

// ---------- Hakuapurit (samat kuin palvelimen logiikka) ----------
function includesCI(hay, q) { return (hay || '').toLowerCase().includes(q.toLowerCase()); }
function makeSnippet(text, q) {
  if (!text) return '';
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return '';
  const start = Math.max(0, idx - 40);
  const end = Math.min(text.length, idx + q.length + 60);
  return (start > 0 ? '…' : '') + text.slice(start, end).trim() + (end < text.length ? '…' : '');
}

// ---------- Store-rajapinta ----------
const Store = {
  mode: 'sandbox',

  categories: {
    async list() { await ready; return clone(DB.categories).sort((a, b) => a.sort_order - b.sort_order || a.name.localeCompare(b.name)); },
    async create(name) {
      await ready;
      const c = { id: nextId(), name: name.trim(), sort_order: (Math.max(0, ...DB.categories.map((x) => x.sort_order)) + 1) };
      DB.categories.push(c); save(DB); return clone(c);
    },
    async rename(id, name) {
      await ready; id = Number(id);
      const c = DB.categories.find((x) => x.id === id); if (c) c.name = name.trim();
      save(DB); return clone(c);
    },
    async remove(id) {
      await ready; id = Number(id);
      const pageIds = DB.pages.filter((p) => p.category_id === id).map((p) => p.id);
      for (const pid of pageIds) await removePageInternal(pid);
      DB.categories = DB.categories.filter((c) => c.id !== id);
      save(DB); return { ok: true };
    },
  },

  pages: {
    async list(categoryId) {
      await ready;
      let rows = DB.pages;
      if (categoryId) { categoryId = Number(categoryId); rows = rows.filter((p) => p.category_id === categoryId); }
      return clone(rows).sort((a, b) => a.title.localeCompare(b.title))
        .map(({ id, category_id, title, updated_at, updated_by }) => ({ id, category_id, title, updated_at, updated_by }));
    },
    async popular(limit = 10) {
      await ready;
      return clone(DB.pages).filter((p) => (p.views || 0) > 0)
        .sort((a, b) => b.views - a.views || a.title.localeCompare(b.title))
        .slice(0, limit)
        .map((p) => ({ id: p.id, title: p.title, category_id: p.category_id, views: p.views, category_name: catName(p.category_id) }));
    },
    async get(id, { track } = {}) {
      await ready; id = Number(id);
      const p = DB.pages.find((x) => x.id === id);
      if (!p) throw new Error('Sivua ei löydy');
      if (track) { p.views = (p.views || 0) + 1; save(DB); }
      const out = clone(p);
      out.attachments = [];
      for (const a of DB.attachments.filter((x) => x.page_id === id)) {
        out.attachments.push({
          id: a.id, original_name: a.original_name, mimetype: a.mimetype, size: a.size,
          uploaded_at: a.uploaded_at, uploaded_by: a.uploaded_by, url: await getBlobUrl(a.id),
        });
      }
      return out;
    },
    async create(data) {
      await ready;
      const p = mkPage(data.category_id ? Number(data.category_id) : null, (data.title || '').trim(), data.content || '', (data.author || '').trim());
      save(DB); return clone(p);
    },
    async update(id, data) {
      await ready; id = Number(id);
      const p = DB.pages.find((x) => x.id === id);
      if (!p) throw new Error('Sivua ei löydy');
      p.title = (data.title || '').trim();
      p.content = data.content || '';
      p.category_id = data.category_id ? Number(data.category_id) : null;
      p.updated_at = nowISO(); p.updated_by = (data.author || '').trim();
      save(DB); return clone(p);
    },
    async remove(id) { await ready; await removePageInternal(Number(id)); save(DB); return { ok: true }; },
  },

  attachments: {
    async upload(pageId, files, author) {
      await ready; pageId = Number(pageId);
      if (!DB.pages.find((p) => p.id === pageId)) throw new Error('Sivua ei löydy');
      for (const f of files) {
        if (!ALLOWED.has(f.type)) throw new Error('Tiedostotyyppiä ei sallita: ' + (f.type || 'tuntematon'));
        if (f.size > MAX_SIZE) throw new Error('Tiedosto on liian suuri (max 50 Mt)');
      }
      for (const f of files) {
        const id = nextId();
        // Selaimessa ei louhita PDF/Office-tekstiä; text-tyypeistä luetaan sisältö.
        let text = '';
        if (f.type.startsWith('text/')) { try { text = await f.text(); } catch (_) {} }
        DB.attachments.push({
          id, page_id: pageId, original_name: f.name, mimetype: f.type,
          size: f.size, uploaded_at: nowISO(), uploaded_by: author || '', text_content: text,
        });
        await putBlob(id, f);
      }
      save(DB); return { ok: true, count: files.length };
    },
    async remove(id) {
      await ready; id = Number(id);
      DB.attachments = DB.attachments.filter((a) => a.id !== id);
      await delBlob(id); save(DB); return { ok: true };
    },
  },

  contacts: {
    async list() { await ready; return clone(DB.contacts).sort((a, b) => a.sort_order - b.sort_order || a.label.localeCompare(b.label)); },
    async create(data) {
      await ready;
      const c = { id: nextId(), label: (data.label || '').trim(), phone: (data.phone || '').trim(), note: (data.note || '').trim(),
        sort_order: (Math.max(0, ...DB.contacts.map((x) => x.sort_order)) + 1) };
      DB.contacts.push(c); save(DB); return clone(c);
    },
    async update(id, data) {
      await ready; id = Number(id);
      const c = DB.contacts.find((x) => x.id === id);
      if (c) { c.label = (data.label || '').trim(); c.phone = (data.phone || '').trim(); c.note = (data.note || '').trim(); }
      save(DB); return clone(c);
    },
    async remove(id) {
      await ready; id = Number(id);
      DB.contacts = DB.contacts.filter((c) => c.id !== id); save(DB); return { ok: true };
    },
  },

  notes: {
    async list({ categoryId, limit } = {}) {
      await ready;
      let rows = clone(DB.notes);
      if (categoryId) { categoryId = Number(categoryId); rows = rows.filter((n) => n.category_id === categoryId); }
      rows.sort((a, b) => b.created_at.localeCompare(a.created_at));
      if (limit) rows = rows.slice(0, limit);
      return rows.map((n) => ({ ...n, category_name: catName(n.category_id) }));
    },
    async create(data) {
      await ready;
      const n = { id: nextId(), category_id: data.category_id ? Number(data.category_id) : null, author: (data.author || '').trim(), content: (data.content || '').trim(), created_at: nowISO() };
      DB.notes.push(n); save(DB); return clone(n);
    },
    async remove(id) {
      await ready; id = Number(id);
      DB.notes = DB.notes.filter((n) => n.id !== id); save(DB); return { ok: true };
    },
  },

  async search(q) {
    await ready;
    q = (q || '').trim();
    if (!q) return { pages: [], notes: [], files: [] };
    const pages = DB.pages.filter((p) => includesCI(p.title, q) || includesCI(p.content, q))
      .sort((a, b) => a.title.localeCompare(b.title))
      .map((p) => ({ id: p.id, title: p.title, category_id: p.category_id, category_name: catName(p.category_id) }));
    const notes = DB.notes.filter((n) => includesCI(n.content, q))
      .sort((a, b) => b.created_at.localeCompare(a.created_at))
      .map((n) => ({ ...clone(n), category_name: catName(n.category_id) }));
    const files = [];
    for (const a of DB.attachments.filter((x) => includesCI(x.original_name, q) || includesCI(x.text_content, q))) {
      const page = DB.pages.find((p) => p.id === a.page_id);
      files.push({
        id: a.id, original_name: a.original_name, mimetype: a.mimetype,
        page_id: a.page_id, page_title: page ? page.title : '',
        category_id: page ? page.category_id : null, category_name: page ? catName(page.category_id) : null,
        snippet: makeSnippet(a.text_content, q), url: await getBlobUrl(a.id),
      });
    }
    return { pages, notes, files };
  },
};

async function removePageInternal(id) {
  const atts = DB.attachments.filter((a) => a.page_id === id);
  for (const a of atts) await delBlob(a.id);
  DB.attachments = DB.attachments.filter((a) => a.page_id !== id);
  DB.pages = DB.pages.filter((p) => p.id !== id);
}

  <script>
'use strict';

// ---------- Pieni apukirjasto ----------
const $ = (sel, root = document) => root.querySelector(sel);
const content = $('#content');

// Datakerros (`Store`) tulee erillisestä tiedostosta: palvelinversiossa
// store-api.js (REST), sandbox-versiossa store-local.js (selaimen tallennus).

function toast(msg, isError = false) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' err' : '');
  setTimeout(() => { el.className = 'toast'; }, 2600);
}

// Nimi tallentuu selaimeen, jotta sitä ei tarvitse kirjoittaa joka kerta.
const author = {
  get: () => localStorage.getItem('tyowiki_author') || '',
  set: (v) => localStorage.setItem('tyowiki_author', v),
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Korostaa hakusanan otteessa (escapeta ensin XSS:n välttämiseksi).
function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
  return safe.replace(re, '<mark>$1</mark>');
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString('fi-FI', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' t';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' kt';
  return (bytes / 1024 / 1024).toFixed(1) + ' Mt';
}

function fileIcon(mime) {
  if (mime === 'application/pdf') return '📕';
  if (mime.startsWith('image/')) return '🖼️';
  if (mime.includes('word')) return '📄';
  if (mime.includes('sheet') || mime.includes('excel')) return '📊';
  return '📎';
}

// ---------- Yksinkertainen Markdown-renderöinti (turvallinen: escapeta ensin) ----------
function renderMarkdown(md) {
  const lines = esc(md).split('\n');
  let html = '', inList = false, inCode = false;
  const inline = (t) => t
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\[(.+?)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  for (let raw of lines) {
    if (raw.trim().startsWith('```')) {
      if (inCode) { html += '</code></pre>'; inCode = false; }
      else { if (inList) { html += '</ul>'; inList = false; } html += '<pre><code>'; inCode = true; }
      continue;
    }
    if (inCode) { html += raw + '\n'; continue; }

    const h = raw.match(/^(#{1,3})\s+(.*)$/);
    const li = raw.match(/^\s*[-*]\s+(.*)$/);
    if (h) {
      if (inList) { html += '</ul>'; inList = false; }
      const lvl = h[1].length;
      html += `<h${lvl}>${inline(h[2])}</h${lvl}>`;
    } else if (li) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inline(li[1])}</li>`;
    } else if (raw.trim() === '') {
      if (inList) { html += '</ul>'; inList = false; }
    } else if (raw.trim().startsWith('&gt;')) {
      html += `<blockquote>${inline(raw.replace(/^\s*&gt;\s?/, ''))}</blockquote>`;
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<p>${inline(raw)}</p>`;
    }
  }
  if (inList) html += '</ul>';
  if (inCode) html += '</code></pre>';
  return html;
}

// ---------- Tila + reititys ----------
let categories = [];
let currentCategoryId = null;

function renderSidebar() {

function setActiveNav(nav) {
  document.querySelectorAll('.nav-link').forEach((b) => b.classList.toggle('active', b.dataset.nav === nav));
}

// Reititys hash-osoitteilla: #/, #/kohde/:id, #/sivu/:id, #/muokkaa/:id, #/uusi, #/vuoroloki, #/haku?q=
async function router() {
  const hash = location.hash.slice(1) || '/';
  const [pathPart, queryPart] = hash.split('?');
  const parts = pathPart.split('/').filter(Boolean);
  closeSidebarMobile();

  try {
    if (parts.length === 0) { setActiveNav('home'); return viewHome(); }
    if (parts[0] === 'vuoroloki') { setActiveNav('shiftlog'); return viewShiftLog(); }
    if (parts[0] === 'kohde') { setActiveNav(''); currentCategoryId = +parts[1]; renderSidebar(); return viewCategory(+parts[1]); }
    if (parts[0] === 'sivu') { setActiveNav(''); return viewPage(+parts[1]); }
    if (parts[0] === 'muokkaa') { setActiveNav(''); return viewPageEdit(+parts[1]); }
    if (parts[0] === 'uusi') { setActiveNav(''); const q = new URLSearchParams(queryPart); return viewPageEdit(null, q.get('kohde')); }
    if (parts[0] === 'haku') { setActiveNav(''); const q = new URLSearchParams(queryPart); return viewSearch(q.get('q') || ''); }
  } catch (e) {
    content.innerHTML = `<div class="card empty">Virhe: ${esc(e.message)}</div>`;
  }
}

  const phone = prompt('Puhelinnumero:', existing ? existing.phone : '');

  const note = prompt('Lisätieto (valinnainen, esim. aukioloaika tai sähköposti):', existing ? existing.note : '') || '';
  const data = { label: label.trim(), phone: phone.trim(), note: note.trim() };
  try {
    if (existing) await Store.contacts.update(existing.id, data);
    else await Store.contacts.create(data);
    toast('Tallennettu'); viewHome();
  } catch (err) { toast(err.message, true); }
}

// ---------- Osittaiset HTML-palaset ----------
function noteHtml(n) {
  return `<div class="note">
    <div class="note-head">
      <span>${n.author ? '<strong>' + esc(n.author) + '</strong> · ' : ''}${esc(fmtDate(n.created_at))}
        ${n.category_name ? '· <span class="tag">' + esc(n.category_name) + '</span>' : ''}</span>
      <button class="icon-btn small" data-delnote="${n.id}" title="Poista">🗑</button>
    </div>
    <div class="note-body">${esc(n.content)}</div>
  </div>`;
}

function contactHtml(c) {
  const tel = c.phone ? c.phone.replace(/[^\d+]/g, '') : '';
  return `<li class="contact">
    <div class="contact-main">
      <div class="contact-label">${esc(c.label)}</div>
      ${c.phone ? `<a class="contact-phone" href="tel:${esc(tel)}">${esc(c.phone)}</a>` : ''}
      ${c.note ? `<div class="att-meta">${esc(c.note)}</div>` : ''}
    </div>
    <div class="contact-actions">
      <button class="icon-btn small" data-editcontact="${c.id}" title="Muokkaa">✏️</button>
      <button class="icon-btn small" data-delcontact="${c.id}" title="Poista">🗑</button>
    </div>
  </li>`;
}

function attHtml(a) {
  return `<li>
    <span class="att-icon">${fileIcon(a.mimetype)}</span>
    <span class="att-name">
      <a href="${a.url}" target="_blank" rel="noopener">${esc(a.original_name)}</a>
      <div class="att-meta">${fmtSize(a.size)} · ${esc(fmtDate(a.uploaded_at))}${a.uploaded_by ? ' · ' + esc(a.uploaded_by) : ''}</div>
    </span>
    <button class="btn small danger" data-delatt="${a.id}">Poista</button>
  </li>`;
}

function bindNoteDelete(refresh) {
  document.querySelectorAll('[data-delnote]').forEach((b) => b.onclick = async () => {
    if (confirm('Poistetaanko huomio?')) { await Store.notes.remove(b.dataset.delnote); refresh(); }
  });
}

// ---------- Globaalit tapahtumat ----------
function closeSidebarMobile() { $('#sidebar').classList.remove('open'); }

document.addEventListener('click', (e) => {
  const page = e.target.closest('[data-page]');
  if (page) { location.hash = '#/sivu/' + page.dataset.page; return; }
  const cat = e.target.closest('[data-cat]');
  if (cat) { location.hash = '#/kohde/' + cat.dataset.cat; return; }
  const nav = e.target.closest('[data-nav]');
  if (nav) { location.hash = nav.dataset.nav === 'home' ? '#/' : '#/vuoroloki'; return; }
});

$('#addCategoryBtn').onclick = async () => {
  const name = prompt('Uuden kohteen nimi:');
  if (name && name.trim()) {
    const c = await Store.categories.create(name);
    await loadCategories(); location.hash = '#/kohde/' + c.id; toast('Kohde lisätty');
  }
};

$('#searchForm').onsubmit = (e) => {
  e.preventDefault();
  const q = $('#searchInput').value.trim();
  if (q) location.hash = '#/haku?q=' + encodeURIComponent(q);
};

$('#menuToggle').onclick = () => $('#sidebar').classList.toggle('open');

const authorInput = $('#authorInput');
authorInput.value = author.get();
authorInput.oninput = () => author.set(authorInput.value);

window.addEventListener('hashchange', router);

// ---------- Käynnistys ----------
(async function init() {
  await loadCategories();
  router();
})();

  </script>
</body>
</html>
